<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kakko. ｜ 参加コミュニティ一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2b2016;
    --ink-soft: #3a2c1d;
    --ink-line: rgba(243, 230, 210, 0.10);
    --paper-text: #f4ead9;
    --muted: #b6a289;
    --accent: #e07b2e;
    --accent-soft: rgba(224, 123, 46, 0.18);
    --seal: #232c46;
    --seal-line: rgba(226, 224, 240, 0.14);
    --seal-text: #eef0f7;
    --seal-muted: #a7aec8;
    --avatar-1: #e2833c;
    --avatar-2: #7089b3;
    --avatar-3: #82946b;
    --radius: 16px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--ink);
  }

  body {
    font-family: 'Manrope', sans-serif;
    color: var(--paper-text);
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(224, 123, 46, 0.10), transparent 60%),
      var(--ink);
  }

  .layout {
    display: flex;
  }

  /* ---------- left sidebar nav (desktop only) ---------- */

  .sidenav {
    display: none;
    flex-direction: column;
    justify-content: space-between;
    width: 248px;
    flex: none;
    min-height: 100vh;
    padding: 26px 16px;
    position: sticky;
    top: 0;
    align-self: flex-start;
  }

  .sidenav-wordmark {
    margin: 0 0 28px;
    padding-left: 12px;
  }

  .sidenav-nav {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 14px;
    border-radius: 999px;
    background: none;
    border: none;
    font-family: 'Manrope', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    text-align: left;
    text-decoration: none;
    width: 100%;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .nav-item:hover { background: rgba(243, 230, 210, 0.06); color: var(--paper-text); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); }

  .nav-icon { flex: none; display: flex; }
  .nav-icon svg { display: block; }

  .sidenav-profile {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 999px;
    cursor: pointer;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    transition: background-color 0.2s ease;
  }

  .sidenav-profile:hover { background: rgba(243, 230, 210, 0.06); }

  .sidenav-profile-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
  }

  .sidenav-profile-text .name {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 14px;
    color: var(--paper-text);
  }

  .sidenav-profile-text .handle {
    font-size: 11.5px;
    color: var(--muted);
  }

  /* ---------- toast ---------- */

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(10px);
    opacity: 0;
    pointer-events: none;
    background: var(--ink-soft);
    border: 1px solid var(--ink-line);
    color: var(--paper-text);
    padding: 10px 20px;
    border-radius: 999px;
    font-family: 'Manrope', sans-serif;
    font-size: 13px;
    font-weight: 600;
    z-index: 50;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ---------- main app column ---------- */

  .app {
    width: 100%;
    max-width: 460px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--ink-line);
    border-right: 1px solid var(--ink-line);
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(43, 32, 22, 0.92);
    backdrop-filter: blur(10px);
    padding: 20px 22px 0;
  }

  .wordmark {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 21px;
    letter-spacing: 0.01em;
    color: var(--paper-text);
    margin: 0 0 18px;
  }

  .wordmark svg { flex: none; }

  .tabs {
    position: relative;
    display: flex;
    gap: 26px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    appearance: none;
    background: none;
    border: none;
    flex: none;
    font-family: 'Manrope', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--muted);
    padding: 0 0 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.25s ease;
  }

  .tab:hover { color: var(--paper-text); }
  .tab.active { color: var(--paper-text); }

  .tab:focus-visible,
  .veil-trigger:focus-visible,
  .engage-btn:focus-visible,
  .hide-again:focus-visible,
  .composer-input:focus-visible,
  .composer-select:focus-visible,
  .composer-submit:focus-visible,
  .composer-cancel:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 4px;
  }

  .tab-track {
    position: relative;
    height: 1px;
    background: var(--ink-line);
  }

  .tab-indicator {
    position: absolute;
    bottom: -1px;
    height: 2px;
    background: var(--accent);
    border-radius: 2px;
    transition: left 0.3s cubic-bezier(.65,0,.35,1), width 0.3s cubic-bezier(.65,0,.35,1);
  }

  /* ---------- composer ---------- */

  .composer {
    margin: 18px 22px 4px;
    padding: 14px 16px;
    background: var(--ink-soft);
    border: 1px solid var(--ink-line);
    border-radius: var(--radius);
    transition: padding 0.3s ease;
  }

  .composer-row {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .composer-input {
    flex: 1;
    width: 100%;
    resize: none;
    background: none;
    border: none;
    color: var(--paper-text);
    font-family: 'Manrope', sans-serif;
    font-size: 14.5px;
    line-height: 1.6;
    padding: 7px 0;
    min-height: 24px;
  }

  .composer-input::placeholder { color: var(--muted); }
  .composer-input:focus { outline: none; }

  .composer-foot {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 10px;
    padding-top: 12px;
    border-top: 1px solid var(--ink-line);
  }

  .composer.is-active .composer-foot { display: flex; }

  .composer-select-wrap {
    position: relative;
    flex: 1;
    min-width: 0;
  }

  .composer-select {
    appearance: none;
    width: 100%;
    background: rgba(242, 239, 230, 0.06);
    border: 1px solid var(--ink-line);
    color: var(--paper-text);
    font-family: 'Manrope', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    border-radius: 20px;
    padding: 7px 30px 7px 13px;
    cursor: pointer;
  }

  .composer-select option { background: var(--ink-soft); color: var(--paper-text); }

  .composer-select-wrap::after {
    content: "";
    position: absolute;
    right: 12px;
    top: 50%;
    width: 7px;
    height: 7px;
    border-right: 1.4px solid var(--muted);
    border-bottom: 1.4px solid var(--muted);
    transform: translateY(-65%) rotate(45deg);
    pointer-events: none;
  }

  .composer-actions {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .composer-cancel {
    appearance: none;
    background: none;
    border: none;
    font-family: 'Manrope', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    padding: 8px 4px;
  }

  .composer-cancel:hover { color: var(--paper-text); }

  .composer-submit {
    appearance: none;
    border: none;
    background: var(--accent);
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .composer-submit:hover { transform: translateY(-1px); }
  .composer-submit:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .composer-hint {
    font-size: 11.5px;
    color: var(--accent);
    margin: 8px 2px 0;
    display: none;
  }

  .composer-hint.show { display: block; }

  /* ---------- search box ---------- */

  .search-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--ink-soft);
    border: 1px solid var(--ink-line);
    border-radius: 999px;
    padding: 11px 16px;
    margin: 18px 0 16px;
  }

  .search-box-icon { flex: none; color: var(--muted); }

  .search-box-input {
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    outline: none;
    font-family: 'Manrope', sans-serif;
    font-size: 14.5px;
    color: var(--paper-text);
  }

  .search-box-input::placeholder { color: var(--muted); }

  .search-clear {
    flex: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(243, 230, 210, 0.08);
    border: none;
    color: var(--muted);
    cursor: pointer;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .search-clear:hover { background: rgba(243, 230, 210, 0.14); color: var(--paper-text); }
  .search-clear[hidden] { display: none; }

  /* ---------- search results ---------- */

  .result-heading {
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 22px 0 2px;
  }

  .result-group:first-child .result-heading { margin-top: 6px; }

  .result-group .post:last-child { border-bottom: none; }

  .result-work {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--ink-line);
  }

  .work-icon {
    flex: none;
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--avatar-1), #7a3a2c 65%, var(--ink-soft));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .result-work-body { flex: 1; min-width: 0; }

  .result-work-title {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 15.5px;
    color: var(--paper-text);
    margin: 0 0 3px;
  }

  .result-work-meta { font-size: 12px; color: var(--muted); margin: 0; }

  .result-work-link {
    flex: none;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    background: var(--accent);
    padding: 7px 14px;
    border-radius: 20px;
    text-decoration: none;
    transition: transform 0.2s ease;
  }

  .result-work-link:hover { transform: translateY(-1px); }

  .result-user {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--ink-line);
  }

  .result-group[data-type="user"] .result-user:last-child { border-bottom: none; }

  .result-user-body { flex: 1; min-width: 0; }

  .result-user-body .name {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 15px;
    color: var(--paper-text);
    margin: 0 0 2px;
  }

  .result-user-meta { font-size: 12px; color: var(--muted); margin: 0; }

  .follow-btn {
    flex: none;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--paper-text);
    background: none;
    border: 1px solid var(--ink-line);
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }

  .follow-btn:hover { border-color: var(--muted); }

  .follow-btn.active {
    background: var(--accent-soft);
    border-color: transparent;
    color: var(--accent);
  }

  .body mark {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 0 2px;
    border-radius: 3px;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 90px 30px;
    color: var(--muted);
    text-align: center;
  }

  .empty-state[hidden] { display: none; }

  .empty-state svg { opacity: 0.5; }

  .empty-state p {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.6;
    max-width: 260px;
  }

  /* ---------- community hub ---------- */

  .hub-topbar { padding-bottom: 18px; }

  .page-title {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 24px;
    color: var(--paper-text);
    margin: 6px 0 4px;
  }

  .page-subtitle {
    font-size: 13.5px;
    color: var(--muted);
    margin: 0;
  }

  .action-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 4px 0 10px;
  }

  .action-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 16px;
    background: var(--ink-soft);
    border: 1px solid var(--ink-line);
    border-radius: var(--radius);
    text-decoration: none;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }

  .action-card:hover { border-color: var(--muted); transform: translateY(-1px); }

  .action-icon {
    flex: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .action-text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .action-text strong {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 15px;
    color: var(--paper-text);
  }

  .action-text small { font-size: 12px; color: var(--muted); }

  .action-arrow { flex: none; color: var(--muted); }

  .section-heading { margin-top: 30px; }

  .community-list { display: flex; flex-direction: column; }

  .community-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--ink-line);
  }

  .community-list .community-card:last-child { border-bottom: none; }

  .community-card-body { flex: 1; min-width: 0; }

  .community-card-title {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 15px;
    color: var(--paper-text);
    margin: 0 0 3px;
  }

  .community-card-meta { font-size: 12px; color: var(--muted); margin: 0; }

  .badge {
    display: inline-block;
    font-family: 'Manrope', sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    margin-left: 4px;
    vertical-align: middle;
  }

  .badge-open { background: var(--accent-soft); color: var(--accent); }
  .badge-approval { background: rgba(112, 137, 179, 0.22); color: #a9c0e6; }
  .badge-invite { background: rgba(130, 148, 107, 0.22); color: #b3cc98; }

  /* ---------- community list / detail ---------- */

  .breadcrumb {
    display: inline-block;
    appearance: none;
    background: none;
    border: none;
    font-family: 'Manrope', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    padding: 0;
    margin: 4px 0 14px;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .breadcrumb:hover { color: var(--paper-text); }

  .community-row {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 0;
    border-bottom: 1px solid var(--ink-line);
    background: none;
    border-left: none;
    border-right: none;
    border-top: none;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
  }

  .community-list .community-row:last-child { border-bottom: none; }

  .community-row .community-card-body {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .community-card-teaser {
    font-size: 12px;
    color: var(--seal-muted);
    margin-top: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .community-header {
    padding: 8px 0 26px;
    border-bottom: 1px solid var(--ink-line);
    margin-bottom: 6px;
  }

  .community-header-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    margin-bottom: 14px;
  }

  .community-header-title {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 20px;
    color: var(--paper-text);
    margin: 0 0 6px;
  }

  .community-header-meta { font-size: 13px; color: var(--muted); margin: 0 0 12px; }

  .community-header-desc {
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--paper-text);
    margin: 0 0 18px;
  }

  .leave-btn {
    appearance: none;
    background: none;
    border: 1px solid var(--ink-line);
    color: var(--muted);
    font-family: 'Manrope', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }

  .leave-btn:hover { border-color: var(--muted); color: var(--paper-text); }

  /* ---------- feed ---------- */

  .feed {
    flex: 1;
    padding: 6px 22px 60px;
  }

  .feed[hidden] { display: none; }

  .post {
    padding: 22px 0;
    border-bottom: 1px solid var(--ink-line);
    animation: none;
  }

  .feed > .post:last-child { border-bottom: none; }

  .post.is-new {
    animation: dropIn 0.5s ease;
  }

  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .post-head {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    margin-bottom: 10px;
  }

  .avatar {
    flex: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 14px;
    color: var(--ink);
  }

  .avatar.a1 { background: var(--avatar-1); }
  .avatar.a2 { background: var(--avatar-2); }
  .avatar.a3 { background: var(--avatar-3); }

  .post-meta {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .name {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 15.5px;
    color: var(--paper-text);
  }

  .community {
    align-self: flex-start;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 9px;
    border-radius: 20px;
  }

  .time {
    flex: none;
    font-size: 12.5px;
    color: var(--muted);
    padding-top: 2px;
  }

  .body {
    margin: 0 0 12px;
    font-size: 15px;
    line-height: 1.75;
    color: var(--paper-text);
    white-space: pre-wrap;
  }

  .engage {
    display: flex;
    gap: 18px;
  }

  .engage-btn {
    appearance: none;
    background: none;
    border: none;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 2px;
    font-family: 'Manrope', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.2s ease;
  }

  .engage-btn svg { flex: none; }
  .engage-btn:hover { color: var(--paper-text); }
  .engage-btn.like:hover,
  .engage-btn.like.active { color: var(--accent); }

  /* ---------- veiled (spoiler-safe) post ---------- */

  .post.veil {
    border-bottom: none;
    padding: 0 0 22px;
  }

  .veil-card {
    background: var(--seal);
    border: 1px solid var(--seal-line);
    border-radius: var(--radius);
    padding: 20px;
    transition: background-color 0.5s ease, border-color 0.5s ease, padding 0.5s ease;
  }

  .veil-trigger {
    appearance: none;
    width: 100%;
    background: none;
    border: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0;
    text-align: left;
    cursor: pointer;
    color: inherit;
  }

  .seal-icon {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(226, 224, 240, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .veil-text {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .veil-text strong {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 15px;
    color: var(--seal-text);
  }

  .veil-text small {
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--seal-muted);
  }

  .veil-cta {
    flex: none;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    background: var(--seal-text);
    padding: 8px 14px;
    border-radius: 20px;
    white-space: nowrap;
    transition: transform 0.2s ease;
  }

  .veil-trigger:hover .veil-cta { transform: translateY(-1px); }

  .veil-content {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.45s ease, opacity 0.35s ease 0.05s, margin-top 0.45s ease;
  }

  .post.veil.is-open .veil-card {
    background: transparent;
    border-color: transparent;
    padding: 0;
  }

  .post.veil.is-open .veil-trigger { display: none; }

  .post.veil.is-open .veil-content {
    max-height: 500px;
    opacity: 1;
    margin-top: 2px;
  }

  .hide-again {
    appearance: none;
    background: none;
    border: none;
    font-family: 'Manrope', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    padding: 2px 0 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .hide-again:hover { color: var(--paper-text); }

  @media (min-width: 980px) {
    .sidenav { display: flex; }
    .topbar .wordmark { display: none; }
    .app { max-width: 1040px; flex: 1 1 auto; }
  }

  @media (max-width: 380px) {
    .topbar { padding: 16px 16px 0; }
    .feed { padding: 4px 16px 50px; }
    .composer { margin: 16px 16px 4px; }
    .veil-trigger { flex-wrap: wrap; }
    .veil-text { min-width: 100%; order: 1; }
    .seal-icon { order: 0; }
    .veil-cta { order: 2; margin: 4px 0 0 48px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }
</style>
</head>
<body>

<div class="layout">

        <button class="nav-item" data-nav="settings" type="button">

            <svg width="19" height="19" viewBox="0 0 19 19" fill="none"><circle cx="9.5" cy="9.5" r="2.6" stroke="currentColor" stroke-width="1.4"/><path d="M9.5 3.2v2M9.5 13.3v2M15.8 9.5h-2M5.2 9.5h-2M13.9 5.1l-1.4 1.4M6.5 12.5l-1.4 1.4M13.9 13.9l-1.4-1.4M6.5 6.5 5.1 5.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>

        <a class="nav-item" href="works.html" data-nav="works">

          </span>

        </a>
        <a class="nav-item active" href="community.html" data-nav="community">
          <span class="nav-icon">
            <svg width="19" height="19" viewBox="0 0 19 19" fill="none"><circle cx="6.8" cy="7.6" r="3" stroke="currentColor" stroke-width="1.3"/><circle cx="13.2" cy="7.6" r="3" stroke="currentColor" stroke-width="1.3"/><path d="M2 15.5c0-2.6 2.1-4.2 4.8-4.2s4.8 1.6 4.8 4.2M9.2 11.6c.6-.2 1.3-.3 2-.3 2.7 0 4.8 1.6 4.8 4.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </span>
          <span>コミュニティ</span>
        </a>
      </nav>
    </div>
    <button class="sidenav-profile" type="button">
      <div class="avatar a1">あ</div>
      <div class="sidenav-profile-text">
        <span class="name">あなた</span>
        <span class="handle">プロフィール</span>
      </div>
    </button>
  </aside>

  <div class="app">

    <header class="topbar hub-topbar" id="list-header">
      <p class="wordmark">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M14 8.6A6 6 0 1 1 7.4 2 4.8 4.8 0 0 0 14 8.6Z" stroke="#e07b2e" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
        kakko.
      </p>
      <a class="breadcrumb" href="community.html">← コミュニティ</a>
      <p class="page-title">参加コミュニティ一覧</p>
      <p class="page-subtitle">参加中のコミュニティと、そのタイムラインを確認できます</p>
    </header>

    <main class="feed" id="list-view">
      <section class="community-list">
        <button class="community-row" type="button" data-community="hai">
          <span class="work-icon">
            <svg width="21" height="21" viewBox="0 0 22 22" fill="none"><path d="M11 2 13.8 8.4 20.8 9 15.4 13.6 17 20.4 11 16.7 5 20.4 6.6 13.6 1.2 9 8.2 8.4 11 2Z" stroke="#f4ead9" stroke-width="1.1" stroke-linejoin="round"/></svg>
          </span>
          <span class="community-card-body">
            <span class="community-card-title">灰と星屑 感想部 <span class="badge badge-open">オープン</span></span>
            <span class="community-card-meta">『灰と星屑』 ・ 1.2万人</span>
            <span class="community-card-teaser">ゆき：最終話、まさかあの伏線がここで回収されるとは…</span>
          </span>
          <span class="action-arrow" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4.5 4.5L5 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </button>
        <button class="community-row" type="button" data-community="silent">
          <span class="work-icon" style="background: linear-gradient(135deg, var(--avatar-3), #5c4a1f 65%, var(--ink-soft));">
            <svg width="21" height="21" viewBox="0 0 22 22" fill="none"><path d="M11 2 13.8 8.4 20.8 9 15.4 13.6 17 20.4 11 16.7 5 20.4 6.6 13.6 1.2 9 8.2 8.4 11 2Z" stroke="#f4ead9" stroke-width="1.1" stroke-linejoin="round"/></svg>
          </span>
          <span class="community-card-body">
            <span class="community-card-title">サイレント・チャプター部 <span class="badge badge-approval">承認制</span></span>
            <span class="community-card-meta">『サイレント・チャプター』 ・ 8,400人</span>
            <span class="community-card-teaser">せんな：OPのアニメーションが毎回芸術点高すぎる。</span>
          </span>
          <span class="action-arrow" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4.5 4.5L5 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </button>
      </section>
    </main>

    <!-- ===== コミュニティ詳細（タイムライン） ===== -->
    <header class="topbar hub-topbar" id="detail-header" hidden>
      <p class="wordmark">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M14 8.6A6 6 0 1 1 7.4 2 4.8 4.8 0 0 0 14 8.6Z" stroke="#e07b2e" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
        kakko.
      </p>
      <button class="breadcrumb" id="back-to-list" type="button">← 一覧に戻る</button>
    </header>

    <main class="feed" id="detail-view" hidden>
      <section class="community-header">
        <span class="work-icon community-header-icon" id="detail-icon">
          <svg width="26" height="26" viewBox="0 0 22 22" fill="none"><path d="M11 2 13.8 8.4 20.8 9 15.4 13.6 17 20.4 11 16.7 5 20.4 6.6 13.6 1.2 9 8.2 8.4 11 2Z" stroke="#f4ead9" stroke-width="1.1" stroke-linejoin="round"/></svg>
        </span>
        <p class="community-header-title" id="detail-title">灰と星屑 感想部 <span class="badge badge-open" id="detail-badge">オープン</span></p>
        <p class="community-header-meta" id="detail-meta">『灰と星屑』 ・ 1.2万人</p>
        <p class="community-header-desc" id="detail-desc"></p>
        <button class="leave-btn" id="leave-btn" type="button">コミュニティを脱退する</button>
      </section>

      <h2 class="result-heading section-heading">タイムライン</h2>
      <div id="detail-posts"></div>
    </main>

  </div>

</div>

<script>
  // ---- community data (demo) ----
  const communities = {
    hai: {
      name: '灰と星屑 感想部',
      work: '『灰と星屑』',
      members: '1.2万人',
      format: 'オープン',
      badgeClass: 'badge-open',
      iconStyle: '',
      desc: '隕石が降った夜から始まる、幼馴染ふたりの再生の物語について語り合うコミュニティです。',
      posts: [
        { avatar: 'a1', initial: 'ゆ', name: 'ゆき', time: '3分前', body: '最終話、まさかあの伏線がここで回収されるとは…完全に予想を裏切られた。読み終えた後もしばらく放心してた。', likes: 24, comments: 5 },
        { avatar: 'a2', initial: 'り', name: 'りく', time: '2時間前', body: '3巻の表紙、伏線だったのか…読み返して鳥肌立った。', likes: 31, comments: 3 },
      ],
    },
    silent: {
      name: 'サイレント・チャプター部',
      work: '『サイレント・チャプター』',
      members: '8,400人',
      format: '承認制',
      badgeClass: 'badge-approval',
      iconStyle: 'background: linear-gradient(135deg, var(--avatar-3), #5c4a1f 65%, var(--ink-soft));',
      desc: '静かな筆致で描かれる心理劇「サイレント・チャプター」の感想を語り合うコミュニティです。',
      posts: [
        { avatar: 'a3', initial: 'せ', name: 'せんな', time: '1時間前', body: 'OPのアニメーションが毎回芸術点高すぎる。今期一番かもしれない。', likes: 56, comments: 12 },
      ],
    },
  };

  const listHeader = document.getElementById('list-header');
  const listView = document.getElementById('list-view');
  const detailHeader = document.getElementById('detail-header');
  const detailView = document.getElementById('detail-view');

  function postHTML(p, communityName) {
    return `
      <article class="post">
        <div class="post-head">
          <div class="avatar ${p.avatar}">${p.initial}</div>
          <div class="post-meta">
            <span class="name">${p.name}</span>
            <span class="community">${communityName}</span>
          </div>
          <time class="time">${p.time}</time>
        </div>
        <p class="body">${p.body}</p>
        <div class="engage">
          <button class="engage-btn like" aria-label="いいね">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 13.8s-5.6-3.4-5.6-7.3a3.1 3.1 0 0 1 5.6-1.9 3.1 3.1 0 0 1 5.6 1.9c0 3.9-5.6 7.3-5.6 7.3Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            ${p.likes}
          </button>
          <button class="engage-btn" aria-label="コメント">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2.5 3.5h11v7.2h-6l-3 2.6v-2.6h-2V3.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            ${p.comments}
          </button>
        </div>
      </article>
    `;
  }

  function attachLikeHandlers(container) {
    container.querySelectorAll('.engage-btn.like').forEach(btn => {
      btn.addEventListener('click', () => {
        const countEl = btn.childNodes[btn.childNodes.length - 1];
        const current = parseInt(btn.textContent.trim(), 10);
        const liked = btn.classList.toggle('active');
        countEl.textContent = ' ' + (liked ? current + 1 : current - 1);
      });
    });
  }

  function openDetail(key) {
    const c = communities[key];
    if (!c) return;
    document.getElementById('detail-icon').setAttribute('style', c.iconStyle);
    document.getElementById('detail-title').innerHTML = c.name + ' <span class="badge ' + c.badgeClass + '">' + c.format + '</span>';
    document.getElementById('detail-meta').textContent = c.work + ' ・ ' + c.members;
    document.getElementById('detail-desc').textContent = c.desc;
    const postsEl = document.getElementById('detail-posts');
    postsEl.innerHTML = c.posts.map(p => postHTML(p, c.name)).join('');
    attachLikeHandlers(postsEl);

    listHeader.hidden = true;
    listView.hidden = true;
    detailHeader.hidden = false;
    detailView.hidden = false;
    window.scrollTo(0, 0);
  }

  function backToList() {
    detailHeader.hidden = true;
    detailView.hidden = true;
    listHeader.hidden = false;
    listView.hidden = false;
    history.replaceState(null, '', 'community-list.html');
  }

  document.querySelectorAll('.community-row').forEach(btn => {
    btn.addEventListener('click', () => openDetail(btn.dataset.community));
  });
  document.getElementById('back-to-list').addEventListener('click', backToList);
  document.getElementById('leave-btn').addEventListener('click', () => {
    showToast('デモのため脱退処理は行われません');
  });

  const params = new URLSearchParams(window.location.search);
  const requested = params.get('c');
  if (requested && communities[requested]) openDetail(requested);

  // ---- left sidebar navigation (only implemented pages are real links) ----
  let toastTimer;
  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      if (item.tagName === 'A') return;
      showToast('この画面は準備中です');
    });
  });

  document.querySelector('.sidenav-profile').addEventListener('click', () => {
    showToast('この画面は準備中です');
  });
</script>

<div class="toast" id="toast"></div>

</body>
